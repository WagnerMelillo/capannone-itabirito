<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#173d2d">
<meta name="robots" content="noindex,nofollow">
<title>Wi-Fi do cliente | Capannone</title>
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/site.css">
<link rel="stylesheet" href="css/utility.css">
</head>
<body class="utility-page">
<header class="utility-header wrap">
  <a class="utility-logo" href="index.html">
    <img src="assets/brand/logo.webp" alt="Capannone Casa das Massas">
  </a>
  <a href="index.html">Voltar ao site</a>
</header>

<main class="portal-main">
  <div class="portal-card">
    <div class="portal-copy">
      <p class="eyebrow light">WI-FI DO CLIENTE</p>
      <h1>Bem-vindo à <em>Capannone.</em></h1>
      <p>Conecte-se ao <strong>Capannone Hotspot</strong>. Para continuar, aceite os termos simples de uso da nossa rede.</p>
      <label class="terms">
        <input type="checkbox" id="terms">
        <span>Vou usar este Wi-Fi de forma responsável, sem atividades ilegais, spam ou tentativas de acesso a outros dispositivos da rede.</span>
      </label>
      <button class="button button-order" id="release-btn" type="button">Liberar Wi-Fi</button>
      <p class="form-message" id="portal-message" role="status"></p>
    </div>
    <div class="portal-image">
      <img src="assets/img/p6_img1.jpg" alt="Pizza Capannone servida quente">
    </div>
  </div>
  <p class="portal-footer-note">Se o acesso não for liberado automaticamente, fale com nossa equipe. Depois de liberar, você poderá navegar normalmente.</p>
</main>

<script src="js/portal.js" defer></script>
</body>
</html>
